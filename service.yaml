apiVersion: v1
kind: Service
metadata:
  name: simulation-service
  namespace: processor
spec:
  ports:
    - name: http
      protocol: TCP
      port: <port>
      targetPort: <port>
  selector:
    app: simulation-service
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
